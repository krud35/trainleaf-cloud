    <meta charset="UTF-8" />

    <meta name="theme-color" content="#F7F8F2" />
    <script id="trainleaf-appearance-bootstrap">
      // Apply the saved appearance and language before CSS, application code or the database loads.
      // The same preference keys as the app: one browser, one choice.
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('trainleaf-theme') || 'system'; } catch { /* Keep the system preference when storage is unavailable. */ }
        const dark = preference === 'dark' || preference !== 'light' && !!window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17251C' : '#F7F8F2';
        let language = 'en';
        try { const saved = localStorage.getItem('trainleaf-language'); if (saved === 'pl' || saved === 'fr' || saved === 'es') language = saved; } catch { /* Keep English when storage is unavailable. */ }
        document.documentElement.lang = language;
      })();
    </script>
    <style>html { background: #F7F8F2; color: #203B2C; } html[data-theme="dark"] { background: #17251C; color: #E2EBDD; }</style>
